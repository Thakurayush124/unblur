[project]
name = "unblur-worker"
version = "0.1.0"
description = "Unblur analysis engine: measures comprehension debt in git repositories"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance tests (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymongo.*", "anthropic.*"]
ignore_missing_imports = true
