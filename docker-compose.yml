# Phase 1: mongo + redis + worker. The api and web services are added in Phases 3-4.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  worker:
    build: ./worker
    env_file: .env
    environment:
      GRASP_MONGO_URL: mongodb://mongo:27017
    volumes:
      - ${GRASP_REPOS_DIR:-./repos}:/repos:ro
    depends_on: [mongo, redis]
    profiles: [cli]  # run on demand: docker compose run --rm worker analyze /repos/<name>
volumes:
  mongo-data:
